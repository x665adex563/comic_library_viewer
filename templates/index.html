<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>{{TITLE}}</title>
<link rel="stylesheet" href="{{TAILWIND_CSS}}">

<style>
body {
  background: #000;
  color: #fff;
  font-family: sans-serif;
}

.reading-history-chapter {
  display: inline-block;
  margin-left: 8px;
  padding: 3px 8px;
  background: #444;
  border-radius: 5px;
  cursor: pointer;
}

.reading-history-title:hover,
.reading-history-chapter:hover {
  text-decoration: underline;
  opacity: 0.7;
  cursor: pointer;
}

#suggestions {
  margin:0 auto;
  width:280px;
  max-height:150px;
  overflow-y:auto;
  background:#222;
  color:#fff;
  border-radius:6px;
  display:none;
  position:absolute;
  left:50%;
  transform:translateX(-50%);
  z-index:500;
  font-size:14px;
}

#suggestions div {
  padding:6px 10px;
  cursor:pointer;
}

#suggestions div:hover {
  background:#444;
}
</style>
</head>

<body>

    {{BACK_BUTTON}}

<div id="home" class="hidden fixed top-5 left-5 z-[200]">
  <a
    href="#"
    onclick="goHome()"
    class="block py-[50px] px-[50px] bg-black text-white rounded-lg text-[20px] opacity-40 no-underline"
  >🏠</a>
</div>

<input
  id="search"
  class="block mx-auto mt-[100px] mb-[12px] w-[280px] px-3 py-2 bg-white text-black rounded-md border border-[#444]"
  placeholder="搜尋資料夾"
>

<button
  id="reading-history-button"
  class="absolute top-[100px] left-[calc(50%+165px)] h-[34px] box-border px-3 py-2 bg-[#222] text-white border border-[#444] rounded-md cursor-pointer leading-4 text-[14px]"
>閱讀紀錄</button>

<div
  id="reading-history-panel"
  class="absolute top-[145px] left-[calc(50%+165px)] w-[300px] h-[523px] p-3 bg-[#222] text-white rounded-lg z-[1001] opacity-100 transition-opacity duration-200 overflow-y-auto"
  style="display: none;"
></div>

<div id="suggestions"></div>

<ul id="list" class="list-none p-0 flex flex-wrap gap-5 my-5 mx-auto max-w-[1180px]">
{{ITEMS}}
</ul>

<button
  id="toTop"
  class="fixed bottom-5 right-5 w-20 h-20 bg-[#111] text-[#524d5e] border-none rounded-[12px] text-[28px] hover:bg-[rgba(255,255,255,0.3)] hover:text-[rgba(0,0,0,0.35)] hover:cursor-pointer"
  onclick="window.scrollTo({top:0,behavior:'smooth'})"
>↑</button>

<script>
const all = "{{ALL_ITEMS}}";
const HOME_PAGE = "{{HOME_PAGE}}";
const viewerPath = {{VIEWER_PATH}};
const READING_HISTORY_KEY = `readingHistory:${viewerPath}`;

const searchInput = document.getElementById('search');
const suggestionBox = document.getElementById('suggestions');
const readingHistoryButton = document.getElementById("reading-history-button");
const readingHistoryPanel = document.getElementById("reading-history-panel");

readingHistoryButton.addEventListener("click", () => {
  const isVisible = readingHistoryPanel.style.display === "block";

  if (isVisible) {
    readingHistoryPanel.style.display = "none";
    return;
  }

  const history = JSON.parse(
    localStorage.getItem(READING_HISTORY_KEY) || "[]"
  );

  readingHistoryPanel.innerHTML = history.length
    ? history.map((item, index) => `
          <div
            class="reading-history-item flex justify-between items-center p-[10px] border border-[#555] rounded-md mb-2"
            data-index="${index}"
          >
            <div>
              <span class="reading-history-title">${item.comicTitle}</span>
              ${item.isSeries
                ? `<span class="reading-history-chapter">第 ${item.title} 話</span>`
                : ""}
            </div>
            <button class="reading-history-delete hover:opacity-70">×</button>
          </div>
      `).join("")
    : "目前沒有閱讀紀錄";

  document.querySelectorAll(".reading-history-item").forEach((item) => {
    const index = Number(item.dataset.index);
    const record = history[index];

    const title = item.querySelector(".reading-history-title");
    const chapter = item.querySelector(".reading-history-chapter");
    const deleteButton = item.querySelector(".reading-history-delete");

    deleteButton.addEventListener("click", (event) => {
      event.stopPropagation();

      history.splice(index, 1);

      localStorage.setItem(
        READING_HISTORY_KEY,
        JSON.stringify(history)
      );

      item.remove();
    });

    title.addEventListener("click", () => {
      if (record.isSeries) {
        location.href = record.parentIndex;
      } else {
        location.href = record.url;
      }
    });

    if (chapter) {
      chapter.addEventListener("click", () => {
        location.href = `${record.url}?page=${record.page}`;
      });
    }
  });

  readingHistoryPanel.style.display = "block";
});

let readingHistoryHideTimer;

readingHistoryPanel.addEventListener("mouseleave", () => {
  readingHistoryHideTimer = setTimeout(() => {
    readingHistoryPanel.style.display = "none";
  }, 1000);
});

readingHistoryPanel.addEventListener("mouseenter", () => {
  clearTimeout(readingHistoryHideTimer);
});

function updateSuggestions() {
    const val = searchInput.value.toLowerCase();

    if(!val) {
        suggestionBox.style.display = 'none';
        return;
    }

    const matches = all.filter(i => i.name.toLowerCase().includes(val));

    suggestionBox.innerHTML = '';

    matches.forEach(m => {
        const div = document.createElement('div');

        div.textContent = m.name;

        div.onclick = () => {
            searchInput.value = m.name;
            search();
            suggestionBox.style.display = 'none';
        };

        suggestionBox.appendChild(div);
    });

    suggestionBox.style.display = matches.length ? 'block' : 'none';
}

function search() {
    const v = searchInput.value.toLowerCase();

    sessionStorage.setItem('last_search', v);

    const ul = document.getElementById('list');

    ul.innerHTML = '';

    document.getElementById('home').style.display = 'block';

    const r = all.filter(i => i.name.toLowerCase().includes(v));

    if(!r.length) {
        ul.innerHTML = '<li>找不到資料</li>';
        return;
    }

    r.forEach(i => {
        let thumb = '';

        if(i.type === 'image') {
            thumb = '<img class="w-full aspect-[3/4] object-cover" src="' + i.thumb + '">';
        } else {
            thumb = '<div class="w-full h-[32px] aspect-[3/4] bg-[#111] flex items-center justify-center text-[24px]">📁</div>';
        }

        ul.innerHTML +=
            '<li class="w-[200px] bg-[#111] p-[10px] text-center rounded-lg"><a class="text-white no-underline" href="' +
            i.link +
            '">' +
            thumb +
            '<div>' +
            i.name +
            '</div></a></li>';
    });
}

searchInput.addEventListener('input', updateSuggestions);

searchInput.addEventListener('keydown', e => {
    if(e.key === 'Enter') {
        search();
        suggestionBox.style.display = 'none';
    }
});

function goHome() {
    sessionStorage.removeItem('last_search');
    location.href = HOME_PAGE;
}

window.addEventListener('DOMContentLoaded', () => {
    const last = sessionStorage.getItem('last_search');

    if(last) {
        searchInput.value = last;
        search();
    }
});
</script>

</body>
</html>
