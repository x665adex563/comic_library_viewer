<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>{{TITLE}}</title>
<link rel="stylesheet" href="{{TAILWIND_CSS}}">

<style>
body.single-page img {
  display: none;
}

body.single-page img.current-page {
  display: block;
  max-width: var(--single-page-max-width);
  margin: 0;
  position: absolute;
  left: 50%;
  transform: translateX(-50%);
}

.ui-fade {
  transition: opacity 0.2s ease;
}

.ui-hidden {
  opacity: 0;
  pointer-events: none;
}

body[data-display-mode="remote"] #page-navigation {
  display: none;
}

body[data-display-mode="remote"] #comic-content {
  position: fixed;
  top: 50%;
  left: var(--remote-image-position);
  width: var(--remote-image-size);
  transform: translate(-50%, -50%) rotate(-90deg);
  transform-origin: center center;
  --remote-image-size: 100%;
}

body[data-display-mode="remote"] #comic-content img {
  width: 100%;
  max-width: none;
}

body[data-display-mode="remote"] #web-mode-button,
body[data-display-mode="remote"] #remote-settings-panel {
  width: 110px;
  padding: 10px;
  box-sizing: border-box;
  background: #222;
  border-radius: 6px;
  color: white;
  font-size: 14px;
}

body[data-display-mode="remote"] #remote-settings-panel {
  position: fixed;
  top: 1%;
  left: 10%;
  z-index: 1002;

  width: 110px;
  padding: 10px;
  box-sizing: border-box;
  background: #222;
  border-radius: 6px;
  color: white;
  font-size: 14px;
  transform: rotate(-90deg);
  transform-origin: center center;
}

body[data-display-mode="remote"] #remote-image-size-control {
  border-top: 0;
  padding-top: 0;
  margin-top: 0;
}

body[data-display-mode="remote"] #remote-image-position-control {
  min-height: 160px;
}

body[data-display-mode="remote"] #remote-image-size-control {
  min-height: 120px;
}

body[data-display-mode="remote"] #remote-image-position {
  transform: rotate(180deg);
}

body[data-display-mode="remote"] #remote-image-position-value {
  width: 45px;
  font-size: 14px;
  color: white;
  transform: rotate(-90deg);
}

body[data-display-mode="remote"] #remote-image-position-top {
  transform: rotate(-90deg);
}

body[data-display-mode="remote"] #remote-image-size-value {
  width: 45px;
  font-size: 14px;
  color: white;
}

body[data-display-mode="remote"] #remote-image-size-full {
  font-size: 14px !important;
  color: white;
}

body[data-display-mode="remote"] #remote-image-size {
  width: 100%;
}

body[data-display-mode="remote"] #back {
  display: none;
}

body[data-display-mode="remote"] #web-mode-ui {
  display: none;
}

body[data-display-mode="normal"] #remote-mode-ui {
  display: none;
}

body[data-display-mode="remote"] #remote-web-mode-button {
  position: fixed;
  top:3%;
  left:4%;
  z-index: 1003;
  transform: rotate(-90deg);
}

body[data-display-mode="remote"] #remote-exit-button {
  position: fixed;
  bottom: 3%;
  left: 4%;
  z-index: 1003;
  width: 130px;
  height: 117px;
  padding: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #1b1b1b;
  border-radius: 8px;
  font-size: 20px;
  text-align: center;
  transform: rotate(-90deg);
}

body[data-display-mode="remote"] #reading-mode-button {
  display: none;
}
</style>
</head>

<body class="m-0 bg-black overflow-x-hidden [&.single-page]:min-h-screen">

{{BACK_BUTTON}}

<script>
  const previousChapter = "{{PREVIOUS_CHAPTER_URL}}";
  const nextChapter = "{{NEXT_CHAPTER_URL}}";
  const parentIndex = "{{PARENT_INDEX_URL}}";
  const viewerPath = {{VIEWER_PATH}};
  const comicTitle = {{COMIC_TITLE}};
  const isSeries = {{IS_SERIES}};
  const READING_HISTORY_KEY = `readingHistory:${viewerPath}`;
  const DISPLAY_MODE_KEY = "displayMode";
</script>

<div
  id="page-navigation"
  class="fixed top-5 left-1/2 -translate-x-1/2 z-[1000] text-center w-[360px] box-border py-[10px] px-5 bg-[#222] rounded-lg opacity-90 ui-fade"
>
  <div id="comic-title" class="text-white mb-2 text-xl">{{TITLE}}</div>

  <div id="chapter-navigation" class="grid grid-cols-[1fr_auto_1fr] items-center w-[240px] mx-auto">
    <div id="previous-chapter" class="text-left text-white [&_a]:no-underline [&_a:hover]:opacity-70">
      {{PREVIOUS_CHAPTER}}
    </div>

    <select id="page-select" class="py-1.5 px-2.5 bg-[#222] text-white border-0 rounded-lg cursor-pointer text-xl font-[inherit] hover:opacity-100 [&_option]:bg-[#222] [&_option]:text-white"></select>

    <div id="next-chapter" class="text-right text-white [&_a]:no-underline [&_a:hover]:opacity-70">
      {{NEXT_CHAPTER}}
    </div>
  </div>
</div>

<div id="reading-mode" class="flex flex-col gap-2 fixed top-5 right-5 z-[1000] [&_button]:py-2.5 [&_button]:px-3.5 [&_button]:bg-[#222] [&_button]:text-white [&_button]:border-0 [&_button]:rounded-lg [&_button]:cursor-pointer [&_button]:opacity-40 [&_button]:text-lg [&_button]:text-left [&_button:hover]:opacity-100 ui-fade">
  <button id="reading-mode-button"></button>

  <div id="web-mode-ui" class="w-full">
    <button
      id="web-mode-button"
      class="w-full py-2.5 px-3.5 bg-[#222] text-white border-0 rounded-lg cursor-pointer opacity-40 text-lg text-left hover:opacity-100"
    >
      Mobile Mode
    </button>
  </div>

  <button id="reading-history-button">閱讀紀錄</button>
  <button id="settings-button">設定</button>

  <div id="settings-panel" class="hidden absolute top-[calc(100%+8px)] right-0 w-full p-4 box-border bg-[#222] text-white rounded-lg opacity-40 hover:opacity-100">
    <button id="wheel-page-button" class="!w-auto !flex !flex-col !items-center !justify-center !gap-1 !box-border !mx-auto !h-auto !min-h-0 !py-1 !px-2 !bg-[#222] !text-white !border !border-white !rounded-lg !cursor-pointer !opacity-100">
      <span>滾輪翻頁</span>
      <span>[ <span id="wheel-page-status">開</span> ]</span>
    </button>

    <div id="single-page-position-control" class="grid grid-cols-[auto_auto] gap-x-px gap-y-2 min-h-[120px] justify-center justify-items-center border-t border-[#555] pt-3 mt-3">
      <label class="col-span-full" for="single-page-position">圖片垂直位置</label>

      <div id="single-page-position-value-control" class="flex flex-col items-center justify-center gap-2">
        <input
          id="single-page-position-value"
          class="w-[50px] text-base box-border bg-[#444] text-white border-0 rounded p-1 text-center translate-y-[3px]"
          type="number"
          min="0"
          max="100"
          value="50"
        >

        <button id="single-page-position-top" class="h-[29px] !text-base box-border bg-[#444] text-white border-0 rounded p-1 cursor-pointer flex items-center justify-center hover:bg-[#555]">置頂</button>
      </div>

      <input
        id="single-page-position"
        class="[writing-mode:vertical-lr] [direction:rtl] w-2 h-[120px] accent-[#444] -translate-y-[3px]"
        type="range"
        min="0"
        max="100"
        value="50"
        orient="vertical"
      >
    </div>

    <div id="single-page-max-width-control" class="flex flex-col items-center gap-1 min-h-[60px] border-t border-[#555] pt-3 mt-3">
      <label for="single-page-max-width">圖片最大寬度</label>

      <div id="single-page-max-width-value-control" class="flex items-center gap-1">
        <input
          id="single-page-max-width-value"
          class="w-[50px] text-base box-border bg-[#444] text-white border-0 rounded p-1 text-center"
          type="number"
          min="0"
          max="100"
          value="100"
        >

        <button id="single-page-max-width-full" class="h-[29px] !text-base box-border bg-[#444] text-white border-0 rounded p-1 cursor-pointer flex items-center justify-center hover:bg-[#555]">滿版</button>
      </div>

      <input
        id="single-page-max-width"
        class="w-full accent-[#444]"
        type="range"
        min="0"
        max="100"
        value="100"
      >
    </div>
  </div>

  <div id="reading-history-panel" class="hidden fixed top-5 right-[180px] w-[300px] h-[552px] p-3 bg-[#222] text-white rounded-lg z-[1001] opacity-40 transition-opacity duration-200 overflow-y-auto hover:opacity-100"></div>
</div>

<div id="chapter-prompt" class="hidden fixed top-[40%] left-1/2 -translate-x-1/2 -translate-y-1/2 p-5 bg-[#222] text-white rounded-lg text-center z-[2000]">
  <div id="chapter-prompt-message" class="mb-3"></div>
  <button id="chapter-prompt-button" class="py-2 px-3.5 bg-[#444] text-white border-0 rounded-md cursor-pointer hover:opacity-80"></button>
</div>

<!-- Remote Mode 專用 UI -->
<div id="remote-mode-ui" class="flex items-center gap-2">
  <button
    id="remote-web-mode-button"
    class="py-2.5 px-3.5 bg-[#222] text-white border-0 rounded-lg cursor-pointer opacity-40 text-lg text-left hover:opacity-100"
  >
   遠端手機模式
  </button>

  <button
    id="remote-exit-button"
    class="bg-[#222] text-white border-0 rounded-lg cursor-pointer hover:opacity-100"
  >
    ←
  </button>

  <div id="remote-settings-panel" class="flex flex-col items-center gap-2">
    <div id="remote-image-position-control" class="hidden flex flex-row items-center gap-2">

      <label for="remote-image-position">
        圖片垂直位置
      </label>

      <div class="flex flex-col items-center gap-6 rotate-90 w-fit">
        <input
          id="remote-image-position"
          class="w-full accent-[#444]"
          type="range"
          min="0"
          max="100"
          value="100"
        >

        <div class="flex flex-row items-center justify-center gap-2">
          <input
            id="remote-image-position-value"
            type="number"
            min="0"
            max="100"
            value="100"
          >

          <button
            id="remote-image-position-top"
            class="h-[29px] !text-base box-border bg-[#444] text-white border-0 rounded p-1 cursor-pointer flex items-center justify-center hover:bg-[#555]"
            type="button"
          >
            置頂
          </button>
        </div>
      </div>

    </div>

    <div id="remote-image-size-control" class="hidden flex flex-col items-center gap-1">
      <label for="remote-image-size">遠端模式圖片大小</label>

      <div id="remote-image-size-value-control" class="flex items-center gap-1">
        <input
          id="remote-image-size-value"
          class="w-[50px] text-base box-border bg-[#444] text-white border-0 rounded p-1 text-center"
          type="number"
          min="0"
          max="100"
          value="100"
        >

        <button
          id="remote-image-size-full"
          class="h-[29px] !text-base box-border bg-[#444] text-white border-0 rounded p-1 cursor-pointer flex items-center justify-center hover:bg-[#555]"
          type="button"
        >
          滿版
        </button>
      </div>

      <input
        id="remote-image-size"
        class="w-full accent-[#444]"
        type="range"
        min="0"
        max="100"
        value="100"
      >
    </div>
  </div>
</div>

<div id="comic-content">
  {{IMAGES}}
</div>

<script>
const READING_MODE_KEY = "readingMode";
const WHEEL_PAGE_KEY = "wheelPage";
const SINGLE_PAGE_POSITION_KEY = "singlePagePosition";

const images = document.querySelectorAll("img");
const PRELOAD_RANGE = 5;
const button = document.getElementById("reading-mode-button");
const wheelPageButton = document.getElementById("wheel-page-button");
const pageSelect = document.getElementById("page-select");
const readingHistoryButton = document.getElementById("reading-history-button");
const readingHistoryPanel = document.getElementById("reading-history-panel");
const settingsButton = document.getElementById("settings-button");
const settingsPanel = document.getElementById("settings-panel");
const webModeButton = document.getElementById("web-mode-button");
const remoteWebModeButton = document.getElementById("remote-web-mode-button");
const remoteExitButton = document.getElementById("remote-exit-button");

let readingMode = localStorage.getItem(READING_MODE_KEY) || "vertical";
let wheelPageEnabled = localStorage.getItem(WHEEL_PAGE_KEY) === "true";
let uiHideTimer;
let currentReadingPage = 0;
let singlePagePosition =
  Number(localStorage.getItem(SINGLE_PAGE_POSITION_KEY)) || 50;

const singlePagePositionControl =
  document.getElementById("single-page-position");

const singlePagePositionValue =
  document.getElementById("single-page-position-value");

const singlePagePositionTop =
  document.getElementById("single-page-position-top");

const singlePageMaxWidthControl =
  document.getElementById("single-page-max-width");

const singlePageMaxWidthValue =
  document.getElementById("single-page-max-width-value");

const singlePageMaxWidthFull =
  document.getElementById("single-page-max-width-full");

const SINGLE_PAGE_MAX_WIDTH_KEY = "singlePageMaxWidth";

const displayMode = localStorage.getItem(DISPLAY_MODE_KEY) || "normal";
document.body.dataset.displayMode = displayMode;

const remoteImageSizeControl = document.getElementById("remote-image-size-control");
const remoteImagePositionControl = document.getElementById("remote-image-position-control");

if (displayMode === "remote") {
  remoteImageSizeControl.classList.remove("hidden");
}

const remoteImageSize = document.getElementById("remote-image-size");
const remoteImageSizeValue = document.getElementById("remote-image-size-value");
const remoteImageSizeFull = document.getElementById("remote-image-size-full");
const comicContent = document.getElementById("comic-content");
const remoteImagePosition = document.getElementById("remote-image-position");
const remoteImagePositionValue = document.getElementById("remote-image-position-value");
const remoteSettingsPanel = document.getElementById("remote-settings-panel");
const remoteSettingsObserver = new ResizeObserver(() => {
  updateRemoteWebModeButtonSize();
});

remoteSettingsObserver.observe(remoteSettingsPanel);

function updateRemoteImagePosition() {
  const value = Number(remoteImagePosition.value);
  const position = 100 - value;

  comicContent.style.left = `${position}%`;
}

remoteImagePosition.addEventListener("input", () => {
  remoteImagePositionValue.value = remoteImagePosition.value;
  updateRemoteImagePosition();
});

remoteImagePositionValue.addEventListener("input", () => {
  const value = Math.min(100, Math.max(0, Number(remoteImagePositionValue.value)));

  remoteImagePosition.value = value;
  remoteImagePositionValue.value = value;

  updateRemoteImagePosition();
});

function updateRemoteWebModeButtonSize() {
  const height = remoteSettingsPanel.getBoundingClientRect().height;

  remoteWebModeButton.style.width = `${height}px`;
}

function getRemoteImageFullSize() {
  return (window.innerHeight / window.innerWidth) * 100;
}

let remoteImageFullSize = getRemoteImageFullSize();

remoteImageSize.addEventListener("input", () => {
  remoteImageSizeValue.value = remoteImageSize.value;

  const size = (Number(remoteImageSize.value) / 100) * remoteImageFullSize;

  comicContent.style.setProperty(
    "--remote-image-size",
    `${size}%`
  );
});

remoteImageSizeValue.addEventListener("input", () => {
  const value = Math.min(100, Math.max(0, Number(remoteImageSizeValue.value)));

  remoteImageSize.value = value;

  const size = (value / 100) * remoteImageFullSize;

  comicContent.style.setProperty(
    "--remote-image-size",
    `${size}%`
  );
});

remoteImageSizeFull.addEventListener("click", () => {
  remoteImageSize.value = 100;
  remoteImageSizeValue.value = 100;

  comicContent.style.setProperty(
    "--remote-image-size",
    `${remoteImageFullSize}%`
  );
});

window.addEventListener("resize", () => {
  remoteImageFullSize = getRemoteImageFullSize();

  const value = Number(remoteImageSize.value);
  const size = (value / 100) * remoteImageFullSize;

  comicContent.style.setProperty(
    "--remote-image-size",
    `${size}%`
  );
});

webModeButton.textContent =
  displayMode === "remote" ? "網頁模式" : "手機模式";

let singlePageMaxWidth =
  Number(localStorage.getItem(SINGLE_PAGE_MAX_WIDTH_KEY)) || 100;

function preloadImage(image) {
  if (!image || image.complete) {
    return;
  }

  const preload = new Image();

  preload.src = image.src;

  if (preload.decode) {
    preload.decode().catch(() => {});
  }
}

function preloadNearbyPages(currentIndex) {
  const start = Math.max(0, currentIndex - 5);
  const end = Math.min(images.length - 1, currentIndex + 20);

  for (let i = start; i <= end; i++) {
    if (i !== currentIndex) {
      preloadImage(images[i]);
    }
  }
}

function updateSinglePagePosition() {
  const currentPage = document.querySelector("img.current-page");

  if (!currentPage) {
    return;
  }

  const maxOffset =
    currentPage.offsetHeight - window.innerHeight;

  const offset =
    maxOffset * (1 - singlePagePosition / 100);

  currentPage.style.top = `${-offset}px`;
}

singlePagePositionTop.addEventListener("click", () => {
  singlePagePosition = 100;

  singlePagePositionValue.value = 100;
  singlePagePositionControl.value = 100;

  localStorage.setItem(
    SINGLE_PAGE_POSITION_KEY,
    singlePagePosition
  );

  document.body.style.setProperty(
    "--single-page-position",
    singlePagePosition
  );

  updateSinglePagePosition();
});

singlePageMaxWidthControl.value = singlePageMaxWidth;
singlePageMaxWidthValue.value = singlePageMaxWidth;

document.body.style.setProperty(
  "--single-page-max-width",
  `${singlePageMaxWidth}vw`
);

singlePageMaxWidthControl.addEventListener("input", () => {
  singlePageMaxWidth = Number(singlePageMaxWidthControl.value);

  singlePageMaxWidthValue.value = singlePageMaxWidth;

  localStorage.setItem(
    SINGLE_PAGE_MAX_WIDTH_KEY,
    singlePageMaxWidth
  );

  document.body.style.setProperty(
    "--single-page-max-width",
    `${singlePageMaxWidth}vw`
  );
});

singlePageMaxWidthFull.addEventListener("click", () => {
  singlePageMaxWidth = 100;

  singlePageMaxWidthValue.value = 100;
  singlePageMaxWidthControl.value = 100;

  localStorage.setItem(
    SINGLE_PAGE_MAX_WIDTH_KEY,
    singlePageMaxWidth
  );

  document.body.style.setProperty(
    "--single-page-max-width",
    "100vw"
  );
});

singlePageMaxWidthValue.addEventListener("input", () => {
  let value = Number(singlePageMaxWidthValue.value);

  if (value < 0) {
    value = 0;
  }

  if (value > 100) {
    value = 100;
  }

  singlePageMaxWidth = value;
  singlePageMaxWidthValue.value = value;
  singlePageMaxWidthControl.value = value;

  localStorage.setItem(
    SINGLE_PAGE_MAX_WIDTH_KEY,
    singlePageMaxWidth
  );

  document.body.style.setProperty(
    "--single-page-max-width",
    `${singlePageMaxWidth}vw`
  );
});

singlePagePositionControl.value = singlePagePosition;
singlePagePositionValue.value = singlePagePosition;

singlePagePositionControl.addEventListener("input", () => {
  singlePagePosition = Number(singlePagePositionControl.value);

  singlePagePositionValue.value = singlePagePosition;

  localStorage.setItem(
    SINGLE_PAGE_POSITION_KEY,
    singlePagePosition
  );

  document.body.style.setProperty(
    "--single-page-position",
    singlePagePosition
  );

  updateSinglePagePosition();
});

singlePagePositionValue.addEventListener("input", () => {
  let value = Number(singlePagePositionValue.value);

  if (value < 0) {
    value = 0;
  }

  if (value > 100) {
    value = 100;
  }

  singlePagePosition = value;
  singlePagePositionValue.value = value;
  singlePagePositionControl.value = value;

  localStorage.setItem(
    SINGLE_PAGE_POSITION_KEY,
    singlePagePosition
  );

  document.body.style.setProperty(
    "--single-page-position",
    singlePagePosition
  );

  updateSinglePagePosition();
});

readingHistoryButton.addEventListener("click", () => {
  const isVisible = readingHistoryPanel.style.display === "block";

  if (isVisible) {
    readingHistoryPanel.style.display = "none";
    return;
  }

  const history = JSON.parse(
    localStorage.getItem(READING_HISTORY_KEY) || "[]"
  );

  readingHistoryPanel.innerHTML = history.length
    ? history.map((item, index) => `
          <div class="reading-history-item flex justify-between items-center p-2.5 border border-[#555] rounded-md mb-2" data-index="${index}">
            <div>
              <span class="reading-history-title hover:underline hover:opacity-70">${item.comicTitle}</span>
              ${item.isSeries
                ? `<span class="reading-history-chapter inline-block ml-2 py-[3px] px-2 bg-[#444] rounded-[5px] cursor-pointer hover:underline hover:opacity-70">第 ${item.title} 話</span>`
                : ""}
            </div>
            <button class="reading-history-delete hover:opacity-70">×</button>
          </div>
      `).join("")
    : "目前沒有閱讀紀錄";

  document.querySelectorAll(".reading-history-item").forEach((item) => {
    const index = Number(item.dataset.index);
    const record = history[index];

    const title = item.querySelector(".reading-history-title");
    const chapter = item.querySelector(".reading-history-chapter");
    const deleteButton = item.querySelector(".reading-history-delete");

    deleteButton.addEventListener("click", (event) => {
      event.stopPropagation();

      history.splice(index, 1);

      localStorage.setItem(
        READING_HISTORY_KEY,
        JSON.stringify(history)
      );

      item.remove();
    });

    title.addEventListener("click", () => {
      if (record.isSeries) {
        location.href = record.parentIndex;
      } else {
        location.href = record.url;
      }
    });

    if (chapter) {
      chapter.addEventListener("click", () => {
        location.href = `${record.url}?page=${record.page}`;
      });
    }
  });

  readingHistoryPanel.style.display = "block";
});

webModeButton.addEventListener("click", () => {
  const currentMode = localStorage.getItem(DISPLAY_MODE_KEY) || "normal";
  const nextMode = currentMode === "remote" ? "normal" : "remote";

  localStorage.setItem(DISPLAY_MODE_KEY, nextMode);
  document.body.dataset.displayMode = nextMode;

  if (nextMode === "remote") {
    remoteImageSizeControl.classList.remove("hidden");
    remoteImagePositionControl.classList.remove("hidden");
  } else {
    remoteImageSizeControl.classList.add("hidden");
    remoteImagePositionControl.classList.add("hidden");
  }

  webModeButton.textContent =
    nextMode === "remote" ? "網頁模式" : "手機模式";
});

remoteWebModeButton.addEventListener("click", () => {
  localStorage.setItem(DISPLAY_MODE_KEY, "normal");
  document.body.dataset.displayMode = "normal";

  remoteImageSizeControl.classList.add("hidden");
});

remoteExitButton.addEventListener("click", () => {
  document.querySelector("#back a").click();
});

settingsButton.addEventListener("click", () => {
  const isVisible = settingsPanel.style.display === "block";

  settingsPanel.style.display = isVisible ? "none" : "block";
});

function updatePageSelect() {
  pageSelect.innerHTML = "";

  images.forEach((image, index) => {
    const option = document.createElement("option");

    option.value = index;
    option.textContent = `${index + 1}/${images.length}`;

    pageSelect.appendChild(option);
  });
}

function updateCurrentPageSelect() {
  const currentPage = document.querySelector("img.current-page");

  if (!currentPage) {
    return;
  }

  const currentIndex = Array.from(images).indexOf(currentPage);

  pageSelect.value = currentIndex;
  currentReadingPage = currentIndex;

  window.history.replaceState(
    null,
    "",
    `?page=${currentIndex}`
  );

  const history = JSON.parse(
    localStorage.getItem(READING_HISTORY_KEY) || "[]"
  );

  const record = history.find(
    (item) => item.comicTitle === comicTitle
  );

  if (record) {
    record.page = currentIndex;

    localStorage.setItem(
      READING_HISTORY_KEY,
      JSON.stringify(history)
    );
  }
}

function saveReadingHistory() {
  const history = JSON.parse(
    localStorage.getItem(READING_HISTORY_KEY) || "[]"
  );

  const currentIndex = currentReadingPage;

  const existingIndex = history.findIndex(
    (item) => item.comicTitle === comicTitle
  );

  const record = {
    title: document.title,
    comicTitle: comicTitle,
    parentIndex: parentIndex,
    isSeries: isSeries,
    url: location.href.split("?")[0],
    page: currentIndex,
    updatedAt: Date.now()
  };

  if (existingIndex >= 0) {
    history.splice(existingIndex, 1);
  }

  history.unshift(record);

  localStorage.setItem(
    READING_HISTORY_KEY,
    JSON.stringify(history.slice(0, 10))
  );
}

function showUI() {
  const back = document.getElementById("back");
  const readingMode = document.getElementById("reading-mode");
  const pageNavigation = document.getElementById("page-navigation");

  back.classList.remove("ui-hidden");
  readingMode.classList.remove("ui-hidden");
  pageNavigation.classList.remove("ui-hidden");

  clearTimeout(uiHideTimer);

  if (
    back.matches(":hover") ||
    readingMode.matches(":hover") ||
    pageNavigation.matches(":hover")
  ) {
    return;
  }

  uiHideTimer = setTimeout(() => {
    hideUI();
  }, 500);
}

function hideUI() {
  document.getElementById("back").classList.add("ui-hidden");
  document.getElementById("reading-mode").classList.add("ui-hidden");
  document.getElementById("page-navigation").classList.add("ui-hidden");

  clearTimeout(uiHideTimer);
}

document.getElementById("back").addEventListener("mouseleave", showUI);
document.getElementById("reading-mode").addEventListener("mouseleave", showUI);

function updateReadingMode() {
  if (readingMode === "single") {
    document.body.classList.add("single-page");

    const currentPage = document.querySelector("img.current-page");

    if (currentPage) {
      const currentIndex = Array.from(images).indexOf(currentPage);
      preloadNearbyPages(currentIndex);
    }

    if (!document.querySelector("img.current-page") && images.length > 0) {
      images[0].classList.add("current-page");
    }

    document.body.style.setProperty(
      "--single-page-position",
      singlePagePosition
    );

    button.textContent = "閱覽模式：單頁";
  } else {
    document.body.classList.remove("single-page");

    images.forEach((image) => {
      image.classList.remove("current-page");
    });

    button.textContent = "閱覽模式：直立";
  }
  document.getElementById("wheel-page-status").textContent =
    wheelPageEnabled ? "開" : "關";
}

button.addEventListener("click", () => {
  readingMode = readingMode === "vertical" ? "single" : "vertical";

  localStorage.setItem(READING_MODE_KEY, readingMode);

  updateReadingMode();
});

pageSelect.addEventListener("change", () => {
  const pageIndex = Number(pageSelect.value);

  if (readingMode === "single") {
    images.forEach((image) => {
      image.classList.remove("current-page");
    });

    images[pageIndex].classList.add("current-page");
  } else {
    images[pageIndex].scrollIntoView();
  }
});

images.forEach((image) => {
  image.addEventListener("load", () => {
    if (image.classList.contains("current-page")) {
      updateSinglePagePosition();
    }
  });

  image.addEventListener("click", () => {
    if (readingMode === "single") {
      showNextPage();
    }
  });

  image.addEventListener("contextmenu", (event) => {
    if (readingMode === "single") {
      event.preventDefault();
      showPreviousPage();
    }
  });
});

document.addEventListener("keydown", (event) => {
  if (readingMode !== "single") {
    return;
  }

  if (event.key === "ArrowRight") {
    showNextPage();
  }

  if (event.key === "ArrowLeft") {
    showPreviousPage();
  }

  if (event.key === "ArrowUp") {
    window.location.href = parentIndex;
  }
});

wheelPageButton.addEventListener("click", () => {
  wheelPageEnabled = !wheelPageEnabled;
  localStorage.setItem(WHEEL_PAGE_KEY, wheelPageEnabled);
  updateReadingMode();
});

document.addEventListener("mousemove", (event) => {
  const upperAreaHeight = window.innerHeight * 0.3;

  if (
    event.clientY <= upperAreaHeight ||
    settingsPanel.contains(event.target)
  ) {
    showUI();
  }
});

document.addEventListener("click", (event) => {
  if (event.target === document.body) {
    showUI();
  }
});

document.addEventListener("wheel", (event) => {
  if (readingHistoryPanel.contains(event.target)) {
    return;
  }

  if (readingMode === "single" && wheelPageEnabled) {
    if (event.deltaY > 0) {
      showNextPage();
    } else if (event.deltaY < 0) {
      showPreviousPage();
    }

    return;
  }

  if (event.deltaY < 0) {
    showUI();
  } else if (event.deltaY > 0) {
    hideUI();
  }
});

function showChapterPrompt(message, buttonText, link) {
  const prompt = document.getElementById("chapter-prompt");
  const messageElement = document.getElementById("chapter-prompt-message");
  const button = document.getElementById("chapter-prompt-button");

  messageElement.textContent = message;
  button.textContent = buttonText;

  prompt.style.display = "block";

  button.onclick = () => {
    window.location.href = link;
  };
}

document.addEventListener("keydown", (event) => {
  if (event.key === "Enter") {
    const prompt = document.getElementById("chapter-prompt");

    if (prompt.style.display === "block") {
      const button = document.getElementById("chapter-prompt-button");
      button.click();
    }
  }

  if (event.key === "Escape") {
    const prompt = document.getElementById("chapter-prompt");

    if (prompt.style.display === "block") {
      prompt.style.display = "none";
    }
  }
});

function showNextPage() {
  const currentPage = document.querySelector("img.current-page");

  if (!currentPage) {
    return;
  }

  const currentIndex = Array.from(images).indexOf(currentPage);

  if (currentIndex < images.length - 1) {
    currentPage.classList.remove("current-page");
    images[currentIndex + 1].classList.add("current-page");
    updateSinglePagePosition();
    updateCurrentPageSelect();
    preloadNearbyPages(currentIndex + 1);
    return;
  }

  if (nextChapter) {
    showChapterPrompt(
      "要前往下一話嗎？",
      "前往下一話",
      nextChapter
    );
  } else if (parentIndex) {
    showChapterPrompt(
      "已達最新話，是否返回目錄？",
      "返回目錄",
      parentIndex
    );
  }
}

function showPreviousPage() {
  const currentPage = document.querySelector("img.current-page");

  if (!currentPage) {
    return;
  }

  const currentIndex = Array.from(images).indexOf(currentPage);

  if (currentIndex > 0) {
    currentPage.classList.remove("current-page");
    images[currentIndex - 1].classList.add("current-page");
    updateSinglePagePosition();
    updateCurrentPageSelect();
    preloadNearbyPages(currentIndex - 1);
    return;
  }

  if (previousChapter) {
    showChapterPrompt(
      "要前往上一話嗎？",
      "前往上一話",
      previousChapter
    );
  }
}

updatePageSelect();
updateReadingMode();
updateSinglePagePosition();

const params = new URLSearchParams(location.search);
const page = Number(params.get("page"));

if (!Number.isNaN(page) && page >= 0 && page < images.length) {
  images.forEach((image) => {
    image.classList.remove("current-page");
  });

  images[page].classList.add("current-page");
  currentReadingPage = page;
  pageSelect.value = page;
}

hideUI();
saveReadingHistory();
</script>
</body>
</html>
