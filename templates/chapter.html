<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>{{TITLE}}</title>

<style>
body {
  margin: 0;
  background: #000;
  overflow-x: hidden;
}

img {
  display: block;
  max-width: 100vw;
  height: auto;
  margin: 0 auto;
}

#back {
  position: fixed;
  top: 20px;
  left: 20px;
}

#back a {
  position: absolute;
  top: 10px;
  left: 10px;
  padding: 50px 50px;
  background: #000000;
  color: #ffffff;
  text-decoration: none;
  border-radius: 8px;
  font-size: 20px;
  opacity: 0.1;
  transition: opacity 0.25s ease, background 0.25s ease;
}

#back:hover a {
  opacity: 1;
  background: #222222;
}
</style>
</head>
