<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>94</title>
<style>
body {
  background: #000;
  color: #fff;
  font-family: sans-serif;
}
a,a:visited,a:hover,a:active {
  color: #fff;
  text-decoration: none;
}
.item-name {
  margin-top: 6px;
  font-size: 14px;
  text-align: center;
  word-break: break-word;
}
#search {
  display:block;
  margin: 100px auto 12px auto;
  width:280px;
  padding:8px 12px;
  background:#fff;
  color:#000;
  border-radius:6px;
  border:1px solid #444;
}
#suggestions {
  margin:0 auto;
  width:280px;
  max-height:150px;
  overflow-y:auto;
  background:#222;
  color:#fff;
  border-radius:6px;
  display:none;
  position:absolute;
  left:50%;
  transform:translateX(-50%);
  z-index:500;
  font-size:14px;
}
#suggestions div {
  padding:6px 10px;
  cursor:pointer;
}
#suggestions div:hover {
  background:#444;
}
ul {
  list-style:none;
  padding:0;
  display:flex;
  flex-wrap:wrap;
  gap:20px;
  max-width:1200px;
  margin:20px auto;
}
li {
  width:200px;
  background:#111;
  padding:10px;
  text-align:center;
  border-radius: 8px;
}
.thumb-img {
  width:100%;
  aspect-ratio:3/4;
  object-fit:cover;
}
.folder-thumb {
  width:100%;
  height:32px;
  aspect-ratio:3/4;
  background:#111;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:24px;
}
#back {
  position: fixed;
  top: 20px;
  left: 0;
  width: 100%;
  z-index: 1000;
  text-align: center;
}
#back a {
  display: inline-block;
  width: 100%;
  padding: 20px 0;
  background: #000;
  color: #fff;
  border-radius: 8px;
  font-size: 20px;
  opacity: 0.6;
}
#home {
  display:none;
  position:fixed;
  top:20px;
  left:20px;
  z-index:200;
}
#home a {
  display:block;
  padding:50px 50px;
  background:#000;
  color:#fff;
  border-radius:8px;
  font-size:20px;
  opacity:0.4;
  text-decoration:none;
}
#toTop {
  position:fixed;
  bottom:20px;
  right:20px;
  width:80px;
  height:80px;
  background:#111;
  color:#524d5e;
  border:none;
  border-radius:12px;
  font-size:28px;
}
#toTop:hover {
  background: rgba(255, 255, 255, 0.3);
  color: rgba(0,0,0,0.35);
  cursor:pointer;
}
</style>
</head>
<body>
<div id="back"><a href="objects.html">←</a></div>
<div id="home"><a href="#" onclick="goHome()">🏠</a></div>
<input id="search" placeholder="搜尋資料夾">
<div id="suggestions"></div>
<ul id="list">
</ul>

<button id="toTop" onclick="window.scrollTo({top:0,behavior:'smooth'})">↑</button>
<script>
const all = [{"name": "[おわそび] 催眠不足3 [中国翻訳]", "link": "%5B%E3%81%8A%E3%82%8F%E3%81%9D%E3%81%B3%5D%20%E5%82%AC%E7%9C%A0%E4%B8%8D%E8%B6%B33%20%5B%E4%B8%AD%E5%9B%BD%E7%BF%BB%E8%A8%B3%5D.html", "thumb": "../../../222/%5B%E3%81%8A%E3%82%8F%E3%81%9D%E3%81%B3%5D%20%E5%82%AC%E7%9C%A0%E4%B8%8D%E8%B6%B33%20%5B%E4%B8%AD%E5%9B%BD%E7%BF%BB%E8%A8%B3%5D/01_onikizoku04.jpg", "type": "image"}, {"name": "[エイトビート (伊藤エイト)]不愛想で背の高い彼女が俺の知らない間に… 1~3[中国翻訳][真不可视汉化组]", "link": "%5B%E3%82%A8%E3%82%A4%E3%83%88%E3%83%93%E3%83%BC%E3%83%88%20%28%E4%BC%8A%E8%97%A4%E3%82%A8%E3%82%A4%E3%83%88%29%5D%E4%B8%8D%E6%84%9B%E6%83%B3%E3%81%A7%E8%83%8C%E3%81%AE%E9%AB%98%E3%81%84%E5%BD%BC%E5%A5%B3%E3%81%8C%E4%BF%BA%E3%81%AE%E7%9F%A5%E3%82%89%E3%81%AA%E3%81%84%E9%96%93%E3%81%AB%E2%80%A6%201~3%5B%E4%B8%AD%E5%9B%BD%E7%BF%BB%E8%A8%B3%5D%5B%E7%9C%9F%E4%B8%8D%E5%8F%AF%E8%A7%86%E6%B1%89%E5%8C%96%E7%BB%84%5D.html", "thumb": "../../../222/%5B%E3%82%A8%E3%82%A4%E3%83%88%E3%83%93%E3%83%BC%E3%83%88%20%28%E4%BC%8A%E8%97%A4%E3%82%A8%E3%82%A4%E3%83%88%29%5D%E4%B8%8D%E6%84%9B%E6%83%B3%E3%81%A7%E8%83%8C%E3%81%AE%E9%AB%98%E3%81%84%E5%BD%BC%E5%A5%B3%E3%81%8C%E4%BF%BA%E3%81%AE%E7%9F%A5%E3%82%89%E3%81%AA%E3%81%84%E9%96%93%E3%81%AB%E2%80%A6%201~3%5B%E4%B8%AD%E5%9B%BD%E7%BF%BB%E8%A8%B3%5D%5B%E7%9C%9F%E4%B8%8D%E5%8F%AF%E8%A7%86%E6%B1%89%E5%8C%96%E7%BB%84%5D/001.png", "type": "image"}, {"name": "222", "link": "222.html", "thumb": "", "type": "folder"}, {"name": "333", "link": "333.html", "thumb": "", "type": "folder"}, {"name": "hooks", "link": "hooks.html", "thumb": "", "type": "folder"}, {"name": "info", "link": "info.html", "thumb": "", "type": "folder"}, {"name": "refactor", "link": "refactor.html", "thumb": "", "type": "folder"}, {"name": "heads", "link": "heads.html", "thumb": "", "type": "folder"}, {"name": "origin", "link": "origin.html", "thumb": "", "type": "folder"}, {"name": "remotes", "link": "remotes.html", "thumb": "", "type": "folder"}, {"name": "refs", "link": "refs.html", "thumb": "", "type": "folder"}, {"name": "logs", "link": "logs.html", "thumb": "", "type": "folder"}, {"name": "3b", "link": "3b.html", "thumb": "", "type": "folder"}, {"name": "5f", "link": "5f.html", "thumb": "", "type": "folder"}, {"name": "14", "link": "14.html", "thumb": "", "type": "folder"}, {"name": "45", "link": "45.html", "thumb": "", "type": "folder"}, {"name": "52", "link": "52.html", "thumb": "", "type": "folder"}, {"name": "58", "link": "58.html", "thumb": "", "type": "folder"}, {"name": "78", "link": "78.html", "thumb": "", "type": "folder"}];
const HOME_PAGE = "94.html";

const searchInput = document.getElementById('search');
const suggestionBox = document.getElementById('suggestions');

function updateSuggestions() {
    const val = searchInput.value.toLowerCase();
    if(!val) {
        suggestionBox.style.display = 'none';
        return;
    }
    const matches = all.filter(i => i.name.toLowerCase().includes(val));
    suggestionBox.innerHTML = '';
    matches.forEach(m => {
        const div = document.createElement('div');
        div.textContent = m.name;
        div.onclick = () => {
            searchInput.value = m.name;
            search();
            suggestionBox.style.display = 'none';
        };
        suggestionBox.appendChild(div);
    });
    suggestionBox.style.display = matches.length ? 'block':'none';
}

function search(){
  const v = searchInput.value.toLowerCase();
  sessionStorage.setItem('last_search', v);
  const ul = document.getElementById('list');
  ul.innerHTML = '';
  document.getElementById('home').style.display = 'block';

  const r = all.filter(i => i.name.toLowerCase().includes(v));
  if(!r.length){
    ul.innerHTML = '<li>找不到資料</li>';
    return;
  }

  r.forEach(i => {
    let thumb = '';
    if(i.type==='image') {
      thumb = '<img class="thumb-img" src="' + i.thumb + '">';
    } else {
      thumb = '<div class="folder-thumb">📁</div>';
    }
    ul.innerHTML += '<li><a href="' + i.link + '">' + thumb + '<div>' + i.name + '</div></a></li>';
  });
}

searchInput.addEventListener('input', updateSuggestions);
searchInput.addEventListener('keydown', e => {
    if(e.key==='Enter') {
        search();
        suggestionBox.style.display = 'none';
    }
});

function goHome(){
  sessionStorage.removeItem('last_search');
  location.href = HOME_PAGE;
}

window.addEventListener('DOMContentLoaded', () => {
  const last = sessionStorage.getItem('last_search');
  if(last){
    searchInput.value = last;
    search();
  }
});
</script>
</body>
</html>
