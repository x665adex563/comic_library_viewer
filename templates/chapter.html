<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>{{TITLE}}</title>
<link rel="stylesheet" href="{{TAILWIND_CSS}}">

<style>
body.single-page img {
  display: none;
}

body.single-page img.current-page {
  display: block;
  max-width: var(--single-page-max-width);
  margin: 0;
  position: absolute;
  left: 50%;
  transform: translateX(-50%);
}

.ui-fade {
  transition: opacity 0.2s ease;
}

.ui-hidden {
  opacity: 0;
  pointer-events: none;
}

body[data-display-mode="remote"] #page-navigation {
  display: none;
}

body[data-display-mode="remote"] #comic-content {
  position: fixed;
  top: 50%;
  left: var(--remote-image-position);
  width: var(--remote-image-size);
  transform: translateY(-50%) rotate(-90deg);
  transform-origin: center center;
  --remote-image-size: 100%;
}

body[data-display-mode="remote"]:not(.single-page) #comic-content {
  position: absolute;
}

body[data-display-mode="remote"] #comic-content img {
  width: 100%;
  max-width: none;
}

body[data-display-mode="remote"] #back {
  display: none;
}

body[data-display-mode="remote"] #web-mode-ui {
  display: none;
}

body[data-display-mode="remote"] #reading-history-button,
body[data-display-mode="remote"] #settings-button {
  display: none;
}

body[data-display-mode="remote"] #reading-history-panel {
  display: none !important;
}

body[data-display-mode="remote"] #settings-panel {
  display: none !important;
}

body[data-display-mode="normal"] #remote-mode-ui {
  display: none;
}

body[data-display-mode="remote"] #reading-mode-button {
  display: none;
}

body[data-display-mode="remote"]:not(.single-page) {
  overflow-x: auto;
}

/* 直立閱讀模式：禁止圖片原生拖曳 */
body:not(.single-page) #comic-content img {
  -webkit-user-drag: none;
  user-select: none;
  -webkit-user-select: none;
}
</style>
</head>

<body class="m-0 bg-black overflow-x-hidden [&.single-page]:min-h-screen">

{{BACK_BUTTON}}

<script>
  const previousChapter = "{{PREVIOUS_CHAPTER_URL}}";
  const nextChapter = "{{NEXT_CHAPTER_URL}}";
  const parentIndex = "{{PARENT_INDEX_URL}}";
  const viewerPath = {{VIEWER_PATH}};
  const comicTitle = {{COMIC_TITLE}};
  const isSeries = {{IS_SERIES}};
  const READING_HISTORY_KEY = `readingHistory:${viewerPath}`;
  const DISPLAY_MODE_KEY = "displayMode";
</script>

<div
  id="page-navigation"
  class="fixed top-5 left-1/2 -translate-x-1/2 z-[1000] text-center w-[360px] box-border py-[10px] px-5 bg-[#222] rounded-lg opacity-90 ui-fade"
>
  <div id="comic-title" class="text-white mb-2 text-xl">{{TITLE}}</div>

  <div id="chapter-navigation" class="grid grid-cols-[1fr_auto_1fr] items-center w-[240px] mx-auto">
    <div id="previous-chapter" class="text-left text-white [&_a]:no-underline [&_a:hover]:opacity-70">
      {{PREVIOUS_CHAPTER}}
    </div>

    <select id="page-select" class="py-1.5 px-2.5 bg-[#222] text-white border-0 rounded-lg cursor-pointer text-xl font-[inherit] hover:opacity-100 [&_option]:bg-[#222] [&_option]:text-white"></select>

    <div id="next-chapter" class="text-right text-white [&_a]:no-underline [&_a:hover]:opacity-70">
      {{NEXT_CHAPTER}}
    </div>
  </div>
</div>

<div id="reading-mode" class="flex flex-col gap-2 fixed top-5 right-5 z-[1000] [&_button]:py-2.5 [&_button]:px-3.5 [&_button]:bg-[#222] [&_button]:text-white [&_button]:border-0 [&_button]:rounded-lg [&_button]:cursor-pointer [&_button]:opacity-40 [&_button]:text-lg [&_button]:text-left [&_button:hover]:opacity-100 ui-fade">
  <button id="reading-mode-button"></button>

  <div id="web-mode-ui" class="w-full">
    <button
      id="web-mode-button"
      class="w-full py-6 px-3.5 bg-[#222] text-white border-0 rounded-lg cursor-pointer opacity-40 text-lg text-left hover:opacity-100"
    >
      Mobile Mode
    </button>
  </div>

  <button id="reading-history-button">閱讀紀錄</button>
  <button id="settings-button">設定</button>

  <div id="settings-panel" class="hidden absolute top-[calc(100%+8px)] right-0 w-full p-4 box-border bg-[#222] text-white rounded-lg opacity-40 hover:opacity-100">
    <button id="wheel-page-button" class="!w-auto !flex !flex-col !items-center !justify-center !gap-1 !box-border !mx-auto !h-auto !min-h-0 !py-1 !px-2 !bg-[#222] !text-white !border !border-white !rounded-lg !cursor-pointer !opacity-100">
      <span>滾輪翻頁</span>
      <span>[ <span id="wheel-page-status">開</span> ]</span>
    </button>

    <div id="single-page-position-control" class="grid grid-cols-[auto_auto] gap-x-px gap-y-2 min-h-[120px] justify-center justify-items-center border-t border-[#555] pt-3 mt-3">
      <label class="col-span-full" for="single-page-position">圖片垂直位置</label>

      <div id="single-page-position-value-control" class="flex flex-col items-center justify-center gap-2">
        <input
          id="single-page-position-value"
          class="w-[50px] text-base box-border bg-[#444] text-white border-0 rounded p-1 text-center translate-y-[3px]"
          type="number"
          min="0"
          max="100"
          value="50"
        >

        <button id="single-page-position-top" class="h-[29px] !text-base box-border bg-[#444] text-white border-0 rounded p-1 cursor-pointer flex items-center justify-center hover:bg-[#555]">置頂</button>
      </div>

      <input
        id="single-page-position"
        class="[writing-mode:vertical-lr] [direction:rtl] w-2 h-[120px] accent-[#444] -translate-y-[3px]"
        type="range"
        min="0"
        max="100"
        value="50"
        orient="vertical"
      >
    </div>

    <div id="single-page-max-width-control" class="flex flex-col items-center gap-1 min-h-[60px] border-t border-[#555] pt-3 mt-3">
      <label for="single-page-max-width">圖片最大寬度</label>

      <div id="single-page-max-width-value-control" class="flex items-center gap-1">
        <input
          id="single-page-max-width-value"
          class="w-[50px] text-base box-border bg-[#444] text-white border-0 rounded p-1 text-center"
          type="number"
          min="0"
          max="100"
          value="100"
        >

        <button id="single-page-max-width-full" class="h-[29px] !text-base box-border bg-[#444] text-white border-0 rounded p-1 cursor-pointer flex items-center justify-center whitespace-nowrap hover:bg-[#555]">滿版</button>
      </div>

      <input
        id="single-page-max-width"
        class="w-full accent-[#444]"
        type="range"
        min="0"
        max="100"
        value="100"
      >
    </div>
  </div>

  <div id="reading-history-panel" class="hidden fixed top-5 right-[180px] w-[300px] h-[552px] p-3 bg-[#222] text-white rounded-lg z-[1001] opacity-40 transition-opacity duration-200 overflow-y-auto hover:opacity-100"></div>
</div>

<div id="chapter-prompt" class="hidden fixed top-[40%] left-1/2 -translate-x-1/2 -translate-y-1/2 p-5 bg-[#222] text-white rounded-lg text-center z-[2000]">
  <div id="chapter-prompt-message" class="mb-3"></div>
  <button id="chapter-prompt-button" class="py-2 px-3.5 bg-[#444] text-white border-0 rounded-md cursor-pointer hover:opacity-80"></button>
</div>

<!-- Remote Mode 專用 UI -->
<!-- 遠端模式 UI 外層 -->
<div
  id="remote-mode-ui"
  class="fixed inset-0 z-[1002] pointer-events-none"
>
  <!-- 直立手機畫布，之後整組旋轉 -->
  <div
    id="remote-controls-canvas"
    class="absolute top-0 left-0 w-[100vh] h-[100vw] origin-top-left pointer-events-none [transform:translateY(100vh)_rotate(-90deg)]"
  >
    <button
      id="remote-exit-button"
      class="absolute top-4 left-4 z-[1003] w-[200px] h-[200px] p-0 flex items-center justify-center bg-[#1b1b1b] rounded-[20px] text-white text-[32px] text-center pointer-events-auto"
      type="button"
    >
      ←
    </button>

    <div
      id="remote-settings-panel"
      class="absolute top-4 right-4 w-[300px] min-h-[700px] p-[10px] box-border bg-[#222] rounded-[20px] text-white text-[20px] flex flex-col items-center gap-6 pointer-events-auto"
    >
      <button
        id="remote-reading-mode-button"
        class="w-full py-2.5 px-3.5 bg-[#222] text-white
          border-0 rounded-lg cursor-pointer text-[40px]
          text-center whitespace-pre-line hover:opacity-100 pointer-events-auto"
        type="button"
      >
        切換閱讀模式
      </button>

      <div class="w-full border-t-4 border-[#555] my-2"></div>

      <button
        id="remote-web-mode-button"
        class="w-full py-2.5 px-3.5 bg-[#222] text-white
          border-x-0 border-t-0 border-0
          rounded-lg cursor-pointer text-[40px]
          text-center hover:opacity-100 pointer-events-auto"
      >
      遠端手機模式
      </button>

      <div class="w-full border-t-4 border-[#555] my-2"></div>

      <button
        id="remote-fullscreen-button"
        class="w-full py-2.5 px-3.5 bg-[#222] text-white
          border-0 rounded-lg cursor-pointer text-[40px]
          text-center hover:opacity-100 pointer-events-auto"
        type="button"
      >
        全螢幕
      </button>

      <div class="w-full border-t-4 border-[#555] my-2"></div>

      <div
        id="remote-image-position-control"
        class="hidden flex flex-col items-center gap-1 border-t-0 pt-0 mt-0 min-h-[120px] text-[40px]"
      >
        <label for="remote-image-position">
          圖片垂直位置
        </label>

        <div class="flex flex-row items-center justify-center gap-15">
          <!-- 數字與置頂按鈕 -->
          <div class="flex flex-col items-center gap-10">
            <input
              id="remote-image-position-value"
              class="w-[100px] text-[40px] text-white text-center box-border bg-[#444] border-0 rounded p-1"
              type="number"
              min="0"
              max="100"
              value="100"
            >

            <button
              id="remote-image-position-top"
              class="w-[100px] h-[70px] text-[40px] text-white box-border bg-[#444] border-0 rounded p-1 cursor-pointer flex items-center justify-center hover:bg-[#555]"
              type="button"
            >
              <span class="whitespace-nowrap">置頂</span>
            </button>
          </div>

          <!-- 垂直滑桿 -->
          <div class="w-[50px] h-[280px] flex items-center justify-center">
            <input
              id="remote-image-position"
              class="w-[280px] shrink-0 h-[80px] -rotate-90 appearance-none
                [&::-webkit-slider-runnable-track]:h-8
                [&::-webkit-slider-runnable-track]:rounded-full
                [&::-webkit-slider-runnable-track]:bg-[#666]
                [&::-webkit-slider-thumb]:appearance-none
                [&::-webkit-slider-thumb]:w-12
                [&::-webkit-slider-thumb]:h-12
                [&::-webkit-slider-thumb]:rounded-full
                [&::-webkit-slider-thumb]:bg-white
                [&::-webkit-slider-thumb]:border-2
                [&::-webkit-slider-thumb]:border-[#444]
                [&::-webkit-slider-thumb]:-mt-2
                [&::-moz-range-track]:h-8
                [&::-moz-range-track]:rounded-full
                [&::-moz-range-track]:bg-[#666]
                [&::-moz-range-thumb]:w-12
                [&::-moz-range-thumb]:h-12
                [&::-moz-range-thumb]:rounded-full
                [&::-moz-range-thumb]:bg-white
                [&::-moz-range-thumb]:border-2
                [&::-moz-range-thumb]:border-[#444]"
              type="range"
              min="0"
              max="100"
              value="100"
            >
          </div>
        </div>
      </div>

      <div class="w-full border-t-4 border-[#555] my-2"></div>

      <div id="remote-image-size-control" class="hidden flex flex-col items-center gap-5 border-t-0 pt-0 mt-0 min-h-[120px] text-[40px]">
        <label for="remote-image-size">圖片最大寬度</label>

        <div id="remote-image-size-value-control" class="flex items-center gap-10">
          <input
            id="remote-image-size-value"
            class="w-[100px] text-[40px] text-white text-center box-border bg-[#444] border-0 rounded p-1"
            type="number"
            min="0"
            max="100"
            value="100"
          >

          <button
            id="remote-image-size-full"
            class="w-[100px] h-[70px] text-[40px] text-white box-border bg-[#444] border-0 rounded p-1 cursor-pointer flex items-center justify-center hover:bg-[#555]"
            type="button"
          >
            滿版
          </button>
        </div>

        <input
          id="remote-image-size"
          class="w-full h-[64px] shrink-0 appearance-none accent-[#444]
            [&::-webkit-slider-runnable-track]:h-6
            [&::-webkit-slider-runnable-track]:rounded-full
            [&::-webkit-slider-runnable-track]:bg-[#666]
            [&::-webkit-slider-thumb]:appearance-none
            [&::-webkit-slider-thumb]:w-12
            [&::-webkit-slider-thumb]:h-12
            [&::-webkit-slider-thumb]:rounded-full
            [&::-webkit-slider-thumb]:bg-white
            [&::-webkit-slider-thumb]:border-2
            [&::-webkit-slider-thumb]:border-[#444]
            [&::-webkit-slider-thumb]:-mt-3
            [&::-moz-range-track]:h-6
            [&::-moz-range-track]:rounded-full
            [&::-moz-range-track]:bg-[#666]
            [&::-moz-range-thumb]:w-12
            [&::-moz-range-thumb]:h-12
            [&::-moz-range-thumb]:rounded-full
            [&::-moz-range-thumb]:bg-white
            [&::-moz-range-thumb]:border-2
            [&::-moz-range-thumb]:border-[#444]"
          type="range"
          min="0"
          max="100"
          value="100"
        >
      </div>
    </div>

  </div>
</div>

<div id="comic-content">
  {{IMAGES}}
</div>

<script src="{{CHAPTER_APP_JS}}"></script>
<script src="{{PRELOAD_JS}}"></script>
<script src="{{REMOTE_MODE_JS}}"></script>
<script src="{{SINGLE_PAGE_MODE_JS}}"></script>
<script src="{{READING_HISTORY_JS}}"></script>
<script src="{{PAGE_NAVIGATION_JS}}"></script>
<script src="{{CHAPTER_JS}}"></script>
</body>
</html>
